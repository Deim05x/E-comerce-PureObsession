spring.application.name=pure-obsession
spring.profiles.default=h2
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Mínimo 32 bytes. Vacío: se genera uno aleatorio al arrancar (los tokens no sobreviven reinicios).
app.jwt.secreto=${JWT_SECRETO:}
app.jwt.expiracion=${JWT_EXPIRACION:1h}
# El frontend local usa Bearer, sin cookies de autenticacion.
app.cors.origenes=${FRONTEND_ORIGENES:http://localhost:5173,http://localhost:3000}
app.checkout.envio-por-vendedor=${ENVIO_POR_VENDEDOR:0}
app.checkout.regalo-por-unidad=${REGALO_POR_UNIDAD:0}
app.recuperacion.url=${RECUPERACION_URL:http://localhost:5173/restablecer}
app.correo.desde=${CORREO_DESDE:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

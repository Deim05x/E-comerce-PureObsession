spring.application.name=pure-obsession
spring.profiles.default=h2
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Mínimo 32 bytes. Vacío: se genera uno aleatorio al arrancar (los tokens no sobreviven reinicios).
app.jwt.secreto=${JWT_SECRETO:}
app.jwt.expiracion=${JWT_EXPIRACION:1h}
